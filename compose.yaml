services:
  aps-server:
    build:
      context: .
      args:
        CODEX_VERSION: "0.149.1"
    image: aps-server:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APS_VAULT_PATH: /vault
      APS_DATA_PATH: /data
      CODEX_HOME: /codex-home
    ports:
      - "${APS_BIND_HOST:-127.0.0.1}:${APS_BIND_PORT:-8080}:8080"
    volumes:
      - "${APS_VAULT_HOST_PATH:?set APS_VAULT_HOST_PATH}:/vault"
      - aps-data:/data
      - "${APS_CODEX_HOME:?set APS_CODEX_HOME}:/codex-home"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  aps-data:
