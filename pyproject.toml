[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-server"
version = "0.2.0"
description = "FastAPI service for canonical APS Vault content and official extensions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Labb32" },
]
keywords = ["aps", "vault", "fastapi", "scheduler", "knowledge-management"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "tzdata==2026.3",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.10.0",
  "pytest==9.1.1",
]

[project.scripts]
aps = "aps_server.cli:main"
aps-git-auth = "aps_server.git_auth:main"

[project.urls]
Homepage = "https://github.com/Labb32/aps-server"
Repository = "https://github.com/Labb32/aps-server"
Documentation = "https://github.com/Labb32/aps-server/tree/main/docs"
Issues = "https://github.com/Labb32/aps-server/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aps_server = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
